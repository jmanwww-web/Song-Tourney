<script>
/* ===== Song Bracket: single-file app. Sections: 1 helpers · 2 import · 3 rules · 4 setup · 5 engine · 6 views · 7 save/share ===== */
const $=s=>document.querySelector(s),A=$("#app"),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const KEY="songbracket_v1",sv=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function normalizeState(x){if(!x)return x;x.B=x.B||[];x.V=x.V||[];x.L=x.L||{};x.H=x.H||[];x.o=x.o||{};
 if(!Array.isArray(x.wc)){if(x.wc&&typeof x.wc==="object"){const w={...x.wc,key:"wc_"+x.wc.id};x.wc=[w];if(x.L.wc!==undefined){x.L[w.key]=x.L.wc;delete x.L.wc}x.H=x.H.map(k=>k==="wc"?w.key:k)}else x.wc=[]}
 x.wc=x.wc.map(w=>({...w,key:w.key||("wc_"+w.id)}));if(!Number.isFinite(x.o.rr))x.o.rr=0;if(!Array.isArray(x.o.rrs)){const R=Math.log2(x.P);x.o.rrs=[R-1-Math.max(0,Math.min(R-1,x.o.rr))]}x.o.rrs=x.o.rrs.filter(Number.isInteger);if(!x.X||typeof x.X!=="object"||Array.isArray(x.X))x.X={};for(const k of Object.keys(x.X)){if(x.X[k])x.X[k]=1;else delete x.X[k]}if(typeof x.o.wcOn!=="boolean")x.o.wcOn=true;delete x.RD;delete x.o.red;return x}
try{S=normalizeState(JSON.parse(localStorage.getItem(KEY)||"null"))}catch(e){}

function add(o,plays){const k=(o.u||(o.t+"|"+o.a)).toLowerCase(),e=LIB.get(k);if(!e){LIB.set(k,o);return}
 e.lib=e.lib||o.lib;e.n=(e.n||0)+(plays?o.n:0);for(const f of["y","p","d","u","l"])if(e[f]==null&&o[f]!=null)e[f]=o[f];if(o.ad&&(!e.ad||o.ad<e.ad))e.ad=o.ad}
async function ingest(files){for(const f of files){const x=await f.text();try{
 if(/\.csv$/i.test(f.name)){const R=csv(x),h=R[0].map(v=>v.trim().toLowerCase()),g=(...n)=>n.map(v=>h.indexOf(v)).find(i=>i>=0);
  const[iu,it,ia,il,iy,ip,id,iA]=[g("track uri"),g("track name","name"),g("artist name(s)","artist name","artist"),g("album name","album"),g("release date"),g("popularity"),g("duration (ms)"),g("added at")];

 else{const j=JSON.parse(x);if(j.tracks)j.tracks.forEach(r=>r.track&&add({t:r.track,a:r.artist||"",l:r.album||"",u:r.uri||null,lib:true}));
  else if(Array.isArray(j))j.forEach(r=>{if(!r.master_metadata_track_name||r.ms_played<3e4)return;add({t:r.master_metadata_track_name,a:r.master_metadata_album_artist_name||"",l:r.master_metadata_album_album_name||"",u:r.spotify_track_uri,n:1,ad:Date.parse(r.ts)||null,lib:false},1)})}
 }catch(e){msg="Couldn’t read "+f.name+"."}}
 msg=LIB.size+" unique songs loaded.";render()}
/* 3 · RULES — auto-flag categories, free-text rules, per-song overrides */
const CATS={live:["Live versions",s=>/\blive\b/i.test(s.t+" "+s.l)],alt:["Alternate takes & demos",s=>/alternate take|outtake|\bdemo\b|rehearsal/i.test(s.t+" "+s.l)],skit:["Skits, intros & interludes",s=>/\bskit\b|interlude|\bintro\b|\boutro\b/i.test(s.t)],short:["Under 60 seconds",s=>s.d&&s.d<6e4],rep:["Reprises",s=>/reprise/i.test(s.t)],ost:["Soundtrack & cast albums",s=>/soundtrack|original (motion picture|cast|score|broadway|london)|\bscore\b|\bost\b/i.test(s.l)]};
for(const k in CATS)CAT[k]=!["rep","ost"].includes(k)||CAT[k]!==false;
const pool=()=>{const any=[...LIB.values()].some(s=>s.lib),t=THR||(any?0:5);return[...LIB.values()].filter(s=>s.lib||(t&&s.n>=t))};
const flags=s=>Object.keys(CATS).filter(k=>CATS[k][1](s));
const lines=()=>TXT.toLowerCase().split("\n").map(x=>x.trim()).filter(Boolean);
function excl(s){const m=M[(s.u||s.t+s.a)];if(m!=null)return m;if(flags(s).some(k=>CAT[k]))return true;const h=(s.t+" "+s.a+" "+s.l).toLowerCase();return lines().some(x=>h.includes(x))}

let DM={};
/* duplicate key: title minus remaster/deluxe tags + first artist + version tags (live, reprise, remix... never merge across those) */
const dkey=s=>{const t=s.t.toLowerCase(),g=(t.match(/\b(live|reprise|acoustic|demo|instrumental|remix|radio edit|alternate|a cappella|karaoke|extended|edit)\b/g)||[]).sort().join("+")+(/\blive\b/i.test(s.l)?"+albumlive":"");return t.replace(/\s*[-–(\[]\s*((\d{4}\s*)?(re-?master(ed)?|deluxe|expanded|anniversary|bonus track|mono|stereo)[^)\]]*)[)\]]?\s*$/,"").replace(/\s+/g," ").trim()+"|"+(s.a||"").toLowerCase().split(",")[0].trim()+"|"+g};
function dg(){const m={};pre().forEach(s=>(m[dkey(s)]=m[dkey(s)]||[]).push(s));return Object.entries(m).filter(e=>e[1].length>1).map(e=>[e[0],e[1].sort((a,b)=>a.t.length-b.t.length)])}
function dupbox(){const D=window.DG=dg();if(!D.length)return"";return`<div class="box"><b>Possible duplicates (${D.length})</b><div class="s">Remasters and deluxe copies of the same song. Untick any you want to keep separate. Live, reprise, acoustic, demo and remix versions are never merged.</div><div style="max-height:260px;overflow:auto">${D.map((e,i)=>`<label class="li"><span>${esc(e[1][0].t)} <span class="s">· ${esc(e[1][0].a)} · also: ${e[1].slice(1).map(s=>esc(s.t)).join("; ")}</span></span><input type="checkbox" data-a="dm" data-i="${i}" ${DM[e[0]]===false?"":"checked"}></label>`).join("")}</div></div>`}
const kept=()=>{const g=new Set;dg().forEach(([k,a])=>{if(DM[k]!==false)a.slice(1).forEach(s=>g.add(s))});return pre().filter(s=>!g.has(s))},kc=()=>{const e=$("#kc");if(e)e.textContent=kept().length+" songs kept · Next →"};
function found(){const q=($("#q")?.value||"").toLowerCase();if(!q)return"";const r=pool().filter(s=>(s.t+" "+s.a+" "+s.l).toLowerCase().includes(q));window.R=r;
 return`<div class="row"><span class="s">${r.length} matches</span><button class="b" data-a="all" data-v="1">Exclude all shown</button><button class="b" data-a="all" data-v="0">Keep all shown</button></div>`+r.slice(0,40).map((s,i)=>`<label class="li"><span>${esc(s.t)} <span class="s">· ${esc(s.a)} · ${esc(s.l)}</span></span><input type="checkbox" data-a="ex" data-i="${i}" ${excl(s)?"checked":""}></label>`).join("")}
function rules(){const P=pool();return`<h1>Exclusions</h1><p class="s">${P.length} songs in your pool. Tick what to drop before the bracket is built. Flagged categories are guesses from titles, albums and lengths.</p><div class="box">${Object.keys(CATS).map(k=>`<label><input type="checkbox" data-a="cat" data-k="${k}" ${CAT[k]?"checked":""}> ${CATS[k][0]} <span class="s">(${P.filter(CATS[k][1]).length} flagged)</span></label>`).join("")}</div>
<div class="box"><b>Drop anything containing…</b><div class="s">One per line; matches title, artist or album.</div><textarea id="tx" rows="3" placeholder="e.g. oppenheimer">${esc(TXT)}</textarea></div>

${dupbox()}
<div class="row"><button class="b" data-a="go" data-v="imp">← Back</button><button class="b p" id="kc" data-a="go" data-v="set">${kept().length} songs kept · Next →</button></div>`}
/* 4 · SETUP */
const roundChecks=(R,sel,cls="rrk",att="")=>Array.from({length:Math.max(0,R-1)},(_,i)=>i+1).map(r=>`<label><input type="checkbox" class="${cls}" ${att} value="${r}"${sel.includes(r)?" checked":""}> ${rn(r,R)}</label>`).join("");
const defaultRounds=R=>{const a=[R-6,R-4].filter(r=>r>=1);return a.length?a:R>=2?[Math.max(1,R-3)]:[]};
function roundOptions(R,selected=0,direct=false){return Array.from({length:Math.max(1,R)},(_,i)=>{const r=direct?i:R-1-i,val=direct?r:i;return`<option value="${val}"${val===selected?" selected":""}>${rn(r,R)}</option>`}).join("")}
function setup(){const K=kept(),c=f=>K.filter(f).length,mx=1<<Math.floor(Math.log2(Math.max(K.length,2))),R=Math.ceil(Math.log2(Math.max(K.length,2)));
 return`<h1>Build your bracket</h1><p class="s">${K.length} songs are in.</p><div class="box"><label>Seed by <select id="sd"><option value="rand">Random</option><option value="old">Longest held / first heard (${c(s=>s.ad)} have dates)</option><option value="new">Most recent finds first</option><option value="plays">Most streams (${c(s=>s.n)} have data)</option></select></label>
<label>Bracket size <select id="sz" data-all="${K.length}"><option value="0">All ${K.length} songs</option>${[1024,512,256,128,64,32,16].filter(n=>n<K.length).map(n=>`<option value="${n}">Top ${n} by seed</option>`).join("")}</select></label>
<label><input type="checkbox" id="ap" checked> Keep songs from the same album apart in Round 1</label><label><input type="checkbox" id="bl"> Blind mode (hide artist and album)</label><label><input type="checkbox" id="sp"> Speed mode (10 seconds, then a coin flip)</label></div>
<div class="box"><b>Favorites</b> <span class="s">(optional)</span><div class="s">Songs you pick here are spread evenly across the bracket so they can’t meet until late.</div><div class="row"><input type="search" id="fq" placeholder="Search to add favorites"></div><div id="fc" class="s">${Object.values(FV).filter(Boolean).length} favorites</div><div id="ff"></div></div>
<div class="box"><label><input type="checkbox" id="wce" checked> <b>Wildcard comebacks</b></label><div class="s">Tag a song 🔁 Another chance during any match; if it is eliminated it gets one random return match in the next round ticked below. You can change this anytime from the Wildcards tab.</div><div id="rrw"><div class="s">Hold wildcard matches in these rounds (tick one or more):</div><div class="row" id="rrc" data-rr="${R}">${roundChecks(R,defaultRounds(R))}</div></div></div>
<div class="row"><button class="b" data-a="go" data-v="rules">← Back</button><button class="b p" data-a="start">Start tournament</button></div>
<p class="s">Seed 1 faces the lowest seed. If the count isn’t a power of two, top seeds get byes. “Seed by” also decides who makes the cut for a smaller bracket.</p>`}
function start(){let K=kept();const sd=$("#sd").value,k={old:s=>s.ad?-s.ad:-9e15,new:s=>s.ad||-9e15,plays:s=>s.n||0,rand:()=>0}[sd];

 let P=1;while(P<K.length)P*=2;let o=[1];while(o.length<P)o=o.flatMap(x=>[x,2*o.length+1-x]);const sl=o.map(x=>x<=K.length?x-1:-1);

  for(const j of[...Array(P/2).keys()].sort(()=>Math.random()-.5)){const c=sl[2*j],d=sl[2*j+1];if(j==i||c<0||d<0||K[c].l==K[b].l||K[d].l==K[a].l)continue;[sl[2*i+1],sl[2*j+1]]=[sl[2*j+1],sl[2*i+1]];break}}
 const fv=K.map((s,i)=>FV[s.u||s.t+s.a]?i:-1).filter(i=>i>=0).sort(()=>Math.random()-.5),f=fv.length,used=new Set;
 fv.forEach((id,j)=>{const lo=Math.floor(j*P/f),hi=Math.floor((j+1)*P/f),c=[];for(let t=lo;t<hi;t++)if(sl[t]>=0&&!used.has(t))c.push(t);if(!c.length)return;const t=c[Math.random()*c.length|0],k=sl.indexOf(id);[sl[k],sl[t]]=[sl[t],sl[k]];used.add(t)});
 S={songs:K.map(s=>({t:s.t,a:s.a,l:s.l,y:s.y,p:s.p,n:s.n,u:s.u})),slots:sl,P,V:[],B:[],L:{},H:[],wc:[],o:{blind:$("#bl").checked,speed:$("#sp").checked,rrs:[...document.querySelectorAll("#rrc .rrk:checked")].map(e=>+e.value),wcOn:$("#wce").checked},X:{}};sv();view="m";step="play"}
/* 5 · ENGINE — state = seeded slots + manual picks (L) + vetoes (V); everything else is derived */
const wcKey=w=>w.key||("wc_"+w.id),wcDone=w=>S.L[wcKey(w)]!==undefined&&S.L[wcKey(w)]!==null;
function returnRound(R=Math.log2(S.P)){const off=Math.max(0,Math.min(R-1,Number.isFinite(S.o?.rr)?S.o.rr:0));return R-1-off}

 for(let r=0;r<R;r++){W[r]=[];for(let i=0;i<P>>(r+1);i++){const g=k=>{let v=r?W[r-1][k]:S.slots[k];const q=(S.wc||[]).filter(w=>w.r==r&&w.k==k);if(q.length&&v!==undefined){for(const wc of q){if(v===undefined)break;if(v<0||S.V.includes(v)||S.V.includes(wc.id))continue;const key=wcKey(wc),m=S.L[key];if(m===v||m===wc.id){if(m===wc.id){if(v>=0)out[v]=r;delete out[wc.id]}else out[wc.id]=r;wins[m]=(wins[m]||0)+1;v=m}else{if(!cur)cur=["wc",r,v,wc.id,key];v=undefined;break}}if(v!==undefined)E[r+"_"+k]=v}return v},a=g(2*i),b=g(2*i+1);let w;if(a===undefined||b===undefined)continue;
  if(a<0&&b<0)w=-1;else if(a<0)w=b;else if(b<0)w=a;else{const va=S.V.includes(a),vb=S.V.includes(b);if(va&&!vb)w=b;else if(vb&&!va)w=a;else{const m=S.L[r+"_"+i];if(m===a||m===b)w=m}}
  if(w===undefined){if(!cur)cur=[r,i,a,b];continue}W[r][i]=w;if(a>=0&&b>=0){wins[w]=(wins[w]||0)+1;out[w===a?b:a]=r}}}

const rn=(r,R)=>R-r==1?"Final":R-r==2?"Semifinals":R-r==3?"Quarterfinals":"Round of "+2**(R-r);
function rank(c){const N=S.songs.length,R=c.R;const fin=id=>id===c.ch?[100,"Champion"]:id in c.out?[c.out[id],c.out[id]==R-1?"Runner-up":c.out[id]==R-2?"Semifinalist":c.out[id]==R-3?"Quarterfinalist":"Out in "+rn(c.out[id],R)]:[50,"Still alive"];
